<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Scene · test bench</title>
  </head>
  <body>
    <!-- Development harness for web/src/scene. Not part of the production build
         (vite only builds index.html). Open /scene-harness.html with `npm run dev`. -->
    <canvas id="scene" aria-hidden="true"></canvas>
    <aside class="mock-column" hidden>
      <p>A sample chat column to check that text stays legible.</p>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer posuere erat a ante venenatis dapibus.</p>
    </aside>
    <nav class="panel" aria-label="Scene controls">
      <fieldset>
        <legend>State</legend>
        <button type="button" data-mood="idle">idle</button>
        <button type="button" data-mood="thinking">thinking</button>
        <button type="button" data-mood="speaking">speaking</button>
        <button type="button" data-mood="debate">debate</button>
        <button type="button" data-mood="synthesis">synthesis</button>
        <button type="button" data-mood="consensus">consensus</button>
        <button type="button" data-mood="error">error</button>
      </fieldset>
      <fieldset>
        <legend>Quality</legend>
        <button type="button" data-quality="high">high</button>
        <button type="button" data-quality="low">low</button>
        <button type="button" data-quality="off">off</button>
      </fieldset>
      <fieldset>
        <legend>Agents</legend>
        <label><input type="checkbox" data-active="claude" /> Claude active</label>
        <label><input type="checkbox" data-active="chatgpt" /> ChatGPT active</label>
        <label><input type="checkbox" id="autopulse" /> Pulses</label>
        <label>Agreement <input type="range" id="agreement" min="-1" max="100" value="-1" /></label>
      </fieldset>
      <fieldset>
        <legend>Lifecycle</legend>
        <label><input type="checkbox" id="paused" /> Paused</label>
        <label><input type="checkbox" id="column" /> Column</label>
        <button type="button" id="recreate">Recreate</button>
        <button type="button" id="dispose">Dispose</button>
      </fieldset>
      <output id="stats">…</output>
    </nav>
    <script type="module" src="/src/scene/harness.ts"></script>
  </body>
</html>
