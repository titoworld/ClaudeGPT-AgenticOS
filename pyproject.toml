[project]
name = "agentic-os"
version = "0.1.0"
description = "ClaudeGPT Agentic OS: un sistema operativo agéntico que orquesta agentes de IA (Claude, GPT...)."
readme = "README.md"
authors = [{ name = "titoworld" }]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.8.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "pydantic-settings>=2.15.0",
    "pyotp>=2.10.0",
    "qrcode>=8.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentic-os = "agentic_os.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
